# JMeter HTML 리포트(dashboard) 설정 — 발생기 VM의 apache-jmeter-5.6.3/bin/user.properties 에 이어붙인다.
#   cat jmeter-user.properties >> ~/apache-jmeter-5.6.3/bin/user.properties
# 이후 REPORT=1 또는 jmeter -g 로 만드는 모든 리포트에 적용된다 (DEPLOY.md 3-3).

# 그래프 해상도. 기본 60000ms(1분 버킷)라 5분 테스트는 점이 5개뿐 → 5초 버킷
jmeter.reportgenerator.overall_granularity=5000

# APDEX 기준. 기본 500ms/1500ms는 ms 단위 민감 시스템에 너무 느슨 → 만족 50ms / 허용 200ms
jmeter.reportgenerator.apdex_satisfied_threshold=50
jmeter.reportgenerator.apdex_toleration_threshold=200
